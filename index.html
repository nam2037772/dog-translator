<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#e8a54b" />
    <title>🐶 사람말 개소리 변환기</title>
    <meta name="description" content="사람의 말을 진짜 개소리로 변환해주는 초경량 웹앱" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button
          type="button"
          id="muteBtn"
          class="mute-btn"
          aria-label="소리 끄기"
          title="소리 끄기"
        >
          🔊
        </button>
        <h1>🐶 사람말 개소리 변환기</h1>
        <p class="subtitle">사람 말을 진짜 개소리로 변환해드려요</p>
        <p class="subtitle">🦮 사람말을 골든 리트리버가 짖어줍니다</p>
        <p class="tagline">직장상사의 말을 개소리로 변환해드립니다 😏</p>
        <p class="tagline">직장상사의 말을 개소리로 들어보세요 😏</p>
      </header>

      <main class="panel">
        <label class="field-label" for="msg">하고 싶은 말</label>
        <textarea
          id="msg"
          class="input"
          placeholder="예) 오늘 야근해야 해."
          maxlength="200"
          rows="3"
        ></textarea>

        <button type="button" id="translateBtn" class="translate-btn">
          번역하기 🐾
        </button>
      </main>

      <section id="resultSection" class="result-section" hidden>
        <div class="result-card">
          <div id="resultQuote" class="result-quote"></div>
          <div class="result-arrow">↓</div>
          <div class="result-char">
            <span class="result-char-emoji">🦮</span>골든 리트리버
          </div>
          <p id="resultDogspeak" class="result-dogspeak"></p>
          <p id="resultMeaning" class="result-meaning"></p>
          <div class="result-watermark">🐶 사람말 개소리 변환기</div>
        </div>

        <div class="result-actions">
          <button type="button" id="replayBtn" class="action-btn">다시 듣기 🔊</button>
          <button type="button" id="copyBtn" class="action-btn">복사 📋</button>
        </div>
      </section>

      <footer class="footer">회원가입 없음 · 저장 없음 · 브라우저에서 바로</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
